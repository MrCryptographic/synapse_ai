<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Create account · Synapse</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { align-items: center; background: #0e0f11; color: #edeef0; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
        main { background: #191b22; border: 1px solid #343640; border-radius: 14px; box-sizing: border-box; padding: 32px; width: min(100% - 32px, 420px); }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: #9a9dab; margin: 0 0 20px; }
        label { display: block; font-size: .9rem; margin: 12px 0 8px; }
        input { background: #0e0f11; border: 1px solid #454753; border-radius: 6px; box-sizing: border-box; color: inherit; font: inherit; padding: 12px; width: 100%; }
        input:focus { border-color: #e8a838; outline: 2px solid #e8a83855; }
        button { background: #e8a838; border: 0; border-radius: 6px; color: #0e0f11; cursor: pointer; font: inherit; font-weight: 700; margin-top: 16px; padding: 12px; width: 100%; }
        .error { color: #ff8c8c; margin: 0 0 16px; }
    </style>
</head>
<body>
    <main>
        <h1>Create a Synapse account</h1>
        <p>Accounts have private conversation histories. Anyone who can reach this server can register.</p>
        <p>Creating the first account removes old shared chat history.</p>
        {% if signup_error %}<p class="error" role="alert">{{ signup_error }}</p>{% endif %}
        <form method="post" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="signup-username">Username</label>
            <input id="signup-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required autofocus>
            <label for="signup-password">Password (at least 12 characters)</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="12" required>
            <button type="submit">Create account</button>
        </form>
        <p><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </main>
</body>
</html>
